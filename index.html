<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文都云图：南京现当代文学地图数字导览与文创平台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.2/echarts.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        :root {
            --primary-color: #1a5fad;
            --secondary-color: #2a8fe6;
            --accent-color: #ff6b6b;
            --dark-text: #2d3748;
            --light-text: #718096;
            --bg-gradient: linear-gradient(135deg, #f8f9fa, #e9ecef);
            --side-panel-bg: rgba(255, 255, 255, 0.9);
            --side-panel-width: 280px;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            color: var(--dark-text);
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://example.com/nanjing-skyline.jpg') center/cover;
            color: white;
            padding: 3rem 1rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            animation: fadeInDown 1s ease;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { 
                opacity: 0;
                transform: translateY(-20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .container {
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 2rem auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
            background: white;
            position: relative;
            z-index: 1;
        }
        
        #mapContainer {
            height: 600px;
            width: 100%;
            position: relative;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        #infoPanel {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            background: white;
            border-right: 1px solid #e2e8f0;
        }
        
        .counter {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            font-weight: 500;
        }
        
        .counter-number {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 0 0.5rem;
            color: rgb(15, 26, 78);
        }
        
        .search-container {
            max-width: 800px;
            margin: -2rem auto 2rem;
            position: relative;
            z-index: 10;
            padding: 0 1rem;
        }
        
        #searchInput {
            width: 100%;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            font-size: 1.1rem;
            transition: all 0.3s;
            background: white url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23718096" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>') no-repeat 1.5rem center;
            padding-left: 3.5rem;
        }
        
        #searchInput:focus {
            outline: none;
            box-shadow: 0 5px 20px rgba(42, 143, 230, 0.3);
            transform: translateY(-2px);
        }
        
        #searchBtn {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            padding: 0 1.5rem;
            border: none;
            background: var(--primary-color);
            color: white;
            border-radius: 0 50px 50px 0;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        #searchBtn:hover {
            background: var(--secondary-color);
        }
        
        /* 新增：年代分层筛选器 */
        .era-filter {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .era-filter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .era-filter-title {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 14px;
        }
        
        .era-filter-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--light-text);
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .era-filter-toggle:hover {
            color: var(--primary-color);
        }
        
        .era-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .era-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .era-option:hover {
            background: rgba(42, 143, 230, 0.1);
        }
        
        .era-option.active {
            background: rgba(42, 143, 230, 0.15);
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .era-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .era-name {
            font-size: 13px;
        }
        
        .era-count {
            margin-left: auto;
            font-size: 12px;
            color: var(--light-text);
        }
        
        /* 新增：立体小人样式 */
        .character {
            position: absolute;
            width: 40px;
            height: 60px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60"><path d="M20 5c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6zm-5 15v10h2V20h6v10h2V20c0-3.3-2.7-6-6-6s-6 2.7-6 6zm-3 15h16v5H12v-5z" fill="%231a5fad"/></svg>') no-repeat;
            background-size: contain;
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.5s;
        }

        /* 新增：小人行走动画 */
        @keyframes walk {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }

        .character.walking {
            animation: walk 0.5s infinite;
        }

        /* 新增：地点信息弹窗 */
        .location-popup {
            position: absolute;
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 250px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1001;
        }

        .location-popup.visible {
            opacity: 1;
        }

        .location-popup h4 {
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 16px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 5px;
        }

        .literary-work-item {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #e2e8f0;
        }

        .literary-work-title {
            font-weight: bold;
            color: var(--dark-text);
        }

        .literary-work-author {
            font-size: 0.85rem;
            color: var(--light-text);
            margin: 0.2rem 0;
        }

        .literary-work-excerpt {
            font-size: 0.8rem;
            line-height: 1.4;
            color: #4a5568;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>探索作家笔下的人文南京</h1>
        <p>文都云图：南京现当代文学地图数字导览与文创平台</p>
    </div>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="请输入作家姓名(如:叶兆言、朱自清...)">
        <button id="searchBtn">搜索</button>
    </div>
    
    <div class="container">
        <!-- 年代分层筛选器 -->
        <div class="era-filter" id="eraFilter">
            <div class="era-filter-header">
                <div class="era-filter-title">年代分层查看</div>
                <button class="era-filter-toggle" id="eraFilterToggle">
                    <i class="bi bi-chevron-down"></i>
                </button>
            </div>
            <div class="era-options" id="eraOptions">
                <!-- 年代选项将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <div id="mapContainer"></div>
        
        <div class="sidebar">
            <div id="infoPanel">
                <div class="default-message">
                    <h3>欢迎使用南京现当代文学地图数字导览与文创平台</h3>
                    <p>在搜索框中输入作家姓名，查看他们在南京的创作足迹</p>
                    <p>点击地图上的标记点，查看作品详情</p>
                    <p>使用右上角年代筛选器按时期查看文学地标</p>
                </div>
            </div>
            
            <div id="counter">
                <div class="counter-label">当前展示</div>
                <div class="counter-number">0</div>
                <div class="counter-label">个相关地标</div>
            </div>
        </div>
    </div>
    
    <!-- 立体小人 -->
    <div class="character" id="character"></div>
    
    <!-- 地点信息弹窗 -->
    <div class="location-popup" id="locationPopup">
        <h4 id="popupLocationName">地点名称</h4>
        <div id="popupWorksList"></div>
    </div>

    <script>
        // 南京文学地标数据（按年代分层）
        const literaryLandmarks = {
            "1920-1930": {
                color: "#ff6b6b",
                landmarks: {
                    "秦淮河": {
                        position: [118.792, 32.0107],
                        works: [
                            {
                                title: "桨声灯影里的秦淮河",
                                author: "朱自清",
                                excerpt: "朱自清与俞平伯同游秦淮河后各自创作的散文名篇"
                            },
                            {
                                title: "桨声灯影里的秦淮河",
                                author: "俞平伯",
                                excerpt: "与朱自清同题创作的经典散文"
                            }
                        ]
                    },
                    "东南大学": {
                        position: [118.783, 32.058],
                        works: [
                            {
                                title: "背影",
                                author: "朱自清",
                                excerpt: "朱自清在南京任教期间创作的经典散文"
                            }
                        ]
                    }
                }
            },
            "1930-1940": {
                color: "#4ecdc4",
                landmarks: {
                    "夫子庙": {
                        position: [118.790, 32.023],
                        works: [
                            {
                                title: "丹风街",
                                author: "张恨水",
                                excerpt: "描写南京老城区市井生活"
                            }
                        ]
                    },
                    "中山陵": {
                        position: [118.858, 32.062],
                        works: [
                            {
                                title: "钟山风雨",
                                author: "张恨水",
                                excerpt: "以南京为背景的长篇小说，描绘了民国时期南京的社会变迁"
                            }
                        ]
                    }
                }
            },
            "1950-1960": {
                color: "#45b7d1",
                landmarks: {
                    "玄武湖": {
                        position: [118.796, 32.073],
                        works: [
                            {
                                title: "小巷深处",
                                author: "陆文夫",
                                excerpt: "描写南京小市民生活的短篇小说"
                            }
                        ]
                    }
                }
            },
            "1980至今": {
                color: "#96ceb4",
                landmarks: {
                    "南京大学": {
                        position: [118.777, 32.057],
                        works: [
                            {
                                title: "南京人",
                                author: "叶兆言",
                                excerpt: "叶兆言笔下南京人的生活百态"
                            }
                        ]
                    },
                    "颐和路": {
                        position: [118.768, 32.055],
                        works: [
                            {
                                title: "颐和路",
                                author: "苏童",
                                excerpt: "描写南京颐和路一带的历史与人文"
                            }
                        ]
                    }
                }
            }
        };

        // 初始化地图
        $(document).ready(function() {
            const myChart = echarts.init(document.getElementById('mapContainer'));
            const character = document.getElementById('character');
            const locationPopup = document.getElementById('locationPopup');
            const eraOptions = document.getElementById('eraOptions');
            
            // 当前选中的年代
            let currentEra = "全部";
            
            // 生成年代选项
            function generateEraOptions() {
                let html = `
                    <div class="era-option ${currentEra === '全部' ? 'active' : ''}" data-era="全部">
                        <div class="era-color" style="background: #718096;"></div>
                        <div class="era-name">全部</div>
                        <div class="era-count" id="count-all">0</div>
                    </div>
                `;
                
                Object.keys(literaryLandmarks).forEach(era => {
                    const color = literaryLandmarks[era].color;
                    const count = Object.keys(literaryLandmarks[era].landmarks).length;
                    
                    html += `
                        <div class="era-option ${currentEra === era ? 'active' : ''}" data-era="${era}">
                            <div class="era-color" style="background: ${color};"></div>
                            <div class="era-name">${era}</div>
                            <div class="era-count" id="count-${era}">${count}</div>
                        </div>
                    `;
                });
                
                eraOptions.innerHTML = html;
                
                // 添加点击事件
                document.querySelectorAll('.era-option').forEach(option => {
                    option.addEventListener('click', function() {
                        const era = this.getAttribute('data-era');
                        selectEra(era);
                    });
                });
            }
            
            // 选择年代
            function selectEra(era) {
                currentEra = era;
                
                // 更新UI
                document.querySelectorAll('.era-option').forEach(option => {
                    if (option.getAttribute('data-era') === era) {
                        option.classList.add('active');
                    } else {
                        option.classList.remove('active');
                    }
                });
                
                // 更新地图
                updateMap();
            }
            
            // 更新地图显示
            function updateMap() {
                const markers = [];
                
                if (currentEra === "全部") {
                    // 显示所有年代的地标
                    Object.keys(literaryLandmarks).forEach(era => {
                        const eraData = literaryLandmarks[era];
                        Object.keys(eraData.landmarks).forEach(name => {
                            const landmark = eraData.landmarks[name];
                            markers.push({
                                name: name,
                                value: landmark.position,
                                works: landmark.works,
                                era: era,
                                symbol: 'pin',
                                symbolSize: [40, 50],
                                itemStyle: { color: eraData.color }
                            });
                        });
                    });
                } else {
                    // 显示特定年代的地标
                    const eraData = literaryLandmarks[currentEra];
                    Object.keys(eraData.landmarks).forEach(name => {
                        const landmark = eraData.landmarks[name];
                        markers.push({
                            name: name,
                            value: landmark.position,
                            works: landmark.works,
                            era: currentEra,
                            symbol: 'pin',
                            symbolSize: [40, 50],
                            itemStyle: { color: eraData.color }
                        });
                    });
                }
                
                // 更新计数器
                $('.counter-number').text(markers.length);
                
                // 更新地图
                myChart.setOption({
                    series: [{
                        data: markers
                    }]
                });
            }
            
            // 显示加载动画
            myChart.showLoading({
                text: '正在加载文学地图...',
                color: '#4a6cf7',
                textColor: '#4a5568',
                maskColor: 'rgba(255, 255, 255, 0.95)'
            });

            // 使用本地地图数据
            fetch('https://geo.datav.aliyun.com/areas_v3/bound/320100_full.json')
                .then(response => response.json())
                .then(nanjingGeoJSON => {
                    echarts.registerMap('nanjing', nanjingGeoJSON);
                    
                    // 生成年代选项
                    generateEraOptions();
                    
                    // 初始显示全部地标
                    updateMap();
                    
                    const option = {
                        title: {
                            text: '南京文学地图',
                            subtext: '作家笔下的人文南京',
                            left: 'center'
                        },
                        tooltip: {
                            trigger: 'item',
                            formatter: params => {
                                if (params.componentType === 'series') {
                                    return `<div style="font-weight:bold">${params.name}</div>
                                            <div>${params.data.works.length}部相关作品</div>
                                            <div style="color:${params.data.itemStyle.color}">${params.data.era}</div>`;
                                }
                                return params.name;
                            }
                        },
                        geo: {
                            map: 'nanjing',
                            roam: true,
                            zoom: 8,
                            center: [118.8, 32.05],
                            itemStyle: {
                                areaColor: '#e8f4ff',
                                borderColor: '#297acc'
                            }
                        },
                        series: [{
                            name: '文学地标',
                            type: 'scatter',
                            coordinateSystem: 'geo',
                            data: [],
                            symbol: 'pin',
                            symbolSize: [40, 50],
                            itemStyle: { color: '#ff6b6b' },
                            label: { show: true, formatter: '{b}' }
                        }]
                    };
                    
                    // 应用配置
                    myChart.setOption(option);
                    myChart.hideLoading();
                    
                    // 地图点击事件
                    myChart.on('click', function(params) {
                        if (params.componentType === 'series') {
                            const location = params.data;
                            
                            let worksHtml = '';
                            if (location.works && location.works.length > 0) {
                                worksHtml = '<div class="literary-works"><h4>相关作品:</h4>';
                                
                                location.works.forEach(work => {
                                    worksHtml += `
                                        <div class="literary-work-item">
                                            <div class="literary-work-title">《${work.title}》</div>
                                            <div class="literary-work-author">作者：${work.author}</div>
                                            <div class="literary-work-excerpt">${work.excerpt}</div>
                                        </div>
                                    `;
                                });
                                
                                worksHtml += '</div>';
                            } else {
                                worksHtml = '<p class="no-works">暂无相关作品信息</p>';
                            }
                            
                            $('#infoPanel').html(`
                                <div class="location-info">
                                    <h3>${location.name || "未知地点"}</h3>
                                    <p class="location-era" style="color:${location.itemStyle.color}">${location.era}</p>
                                    ${worksHtml}
                                </div>
                            `);
                        }
                    });
                    
                    // 鼠标移动事件 - 控制小人行走
                    $('#mapContainer').mousemove(function(e) {
                        const rect = this.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        
                        // 限制角色不超出地图范围
                        const posX = Math.max(20, Math.min(rect.width - 20, x));
                        const posY = Math.max(30, Math.min(rect.height - 30, y));
                        
                        character.style.left = posX + 'px';
                        character.style.top = posY + 'px';
                        
                        // 添加行走动画
                        character.classList.add('walking');
                        
                        // 清除之前的定时器
                        clearTimeout(character.walkingTimeout);
                        
                        // 设置定时器在鼠标停止移动后移除行走动画
                        character.walkingTimeout = setTimeout(() => {
                            character.classList.remove('walking');
                        }, 500);
                        
                        // 检查是否接近地标
                        checkNearbyLandmarks(posX, posY, rect.width, rect.height);
                    });
                    
                    // 检查附近地标
                    function checkNearbyLandmarks(x, y, width, height) {
                        const threshold = 50; // 像素距离阈值
                        let nearestLandmark = null;
                        let minDistance = Infinity;
                        
                        // 获取当前显示的地标数据
                        const currentData = myChart.getOption().series[0].data;
                        
                        // 遍历所有地标
                        currentData.forEach(landmarkData => {
                            const pixelCoord = myChart.convertToPixel('geo', landmarkData.value);
                            
                            // 计算距离
                            const distance = Math.sqrt(
                                Math.pow(x - pixelCoord[0], 2) + 
                                Math.pow(y - pixelCoord[1], 2)
                            );
                            
                            if (distance < threshold && distance < minDistance) {
                                minDistance = distance;
                                nearestLandmark = {
                                    name: landmarkData.name,
                                    works: landmarkData.works
                                };
                            }
                        });
                        
                        // 显示或隐藏弹窗
                        if (nearestLandmark) {
                            showLandmarkPopup(nearestLandmark, x, y);
                        } else {
                            hideLandmarkPopup();
                        }
                    }
                    
                    // 显示地标信息弹窗
                    function showLandmarkPopup(landmark, x, y) {
                        const popup = $('#locationPopup');
                        const popupName = $('#popupLocationName');
                        const popupWorks = $('#popupWorksList');
                        
                        popupName.text(landmark.name);
                        
                        // 构建作品列表
                        let worksHtml = '';
                        landmark.works.forEach(work => {
                            worksHtml += `
                                <div class="literary-work-item">
                                    <div class="literary-work-title">《${work.title}》</div>
                                    <div class="literary-work-author">作者：${work.author}</div>
                                    <div class="literary-work-excerpt">${work.excerpt}</div>
                                </div>
                            `;
                        });
                        
                        popupWorks.html(worksHtml);
                        
                        // 定位弹窗位置
                        popup.css({
                            left: x + 30 + 'px',
                            top: y - 50 + 'px'
                        }).addClass('visible');
                    }
                    
                    // 隐藏地标信息弹窗
                    function hideLandmarkPopup() {
                        $('#locationPopup').removeClass('visible');
                    }
                    
                    // 响应窗口大小变化
                    window.addEventListener('resize', function() {
                        myChart.resize();
                    });
                });
        });
    </script>
</body>
</html>
